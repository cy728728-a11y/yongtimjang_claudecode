# 웹앱 전용 pytest 설정.
#
# testpaths 를 일부러 비워둔다 — 실행은 항상 저장소 루트에서
# `.venv-web/bin/pytest webapp/tests ...` 형태로 경로를 명시해 돈다.
# webapp/__init__.py · webapp/tests/__init__.py 가 있으므로 pytest 가
# 패키지 조상을 따라 저장소 루트를 sys.path 에 넣어준다 → `import webapp.paths` 가 산다.
#
# filterwarnings = error 는 넣지 않는다. 외부 라이브러리(fastapi·starlette) 경고로
# 우리 잘못이 아닌 실패가 나면 테스트를 아무도 안 믿게 된다.
[pytest]
# `cli/` 는 **`.venv`(CLI venv)로 도는 테스트**다. `.venv-web` 이 `webapp/tests` 를
# 통째로 수집하면 `Vision`(pyobjc) 이 없어 collect 단계에서 에러가 난다 —
# 테스트가 빨간 게 아니라 **스위트가 안 뜬다**.
#
# `pytest.importorskip` 으로 덮지 않는다 (`conftest.py` 의 규율): 덮으면 미설치가
# 초록으로 보이고, "OCR 이 안 돌았다" 가 "통과" 로 기록된다. 대신 **수집에서 빼고**
# 실행은 경로를 명시해 돈다:
#     .venv/bin/python3 -m pytest webapp/tests/cli/test_ocr_determinism.py
#
# 기본값(`.*`·`build`·`dist`·`node_modules`…)을 **같이 적는다** — norecursedirs 는
# 덮어쓰기라 `cli` 만 적으면 `.git`·`.venv` 까지 뒤지기 시작한다.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} cli
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers

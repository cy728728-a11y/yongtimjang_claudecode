<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상세페이지 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#2b2a28;--card:#3a3835;--ink:#f3efe8;--sub:#bdb5a8;--accent:#c9a96e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:18px 24px 14px;border-bottom:1px solid #444}
h1{margin:0 0 12px;font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 10px;border-bottom:1px solid #444;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;width:110px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px 24px;max-width:1800px;margin:0 auto}
.col h2{position:sticky;top:var(--hh,190px);background:var(--bg);margin:0 0 10px;padding:8px 0;font-size:18px}
.col h2 span{color:var(--accent)}
.col img{display:block;width:100%;margin:0 0 6px;background:#fff}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
</style></head><body>
<header><h1>같은 상품, 같은 아스트라 — 지시가 달라지면</h1>
<table>
<tr><th></th><td><b>왼쪽 · 10/19 마지막 버전</b></td><td><b>오른쪽 · 10/22 v4.1</b></td></tr>
<tr><th>톤</th><td>짙은 초록·검정, AI 생성 배경</td><td>아이보리·베이지 한 톤 + 진갈색 강조 1개 (레퍼런스 실측)</td></tr>
<tr><th>장수</th><td>6장</td><td>12장 (메시지 수·쓸 컷 수로 자동 결정)</td></tr>
<tr><th>원본 컷</th><td>몇 개 반복</td><td>52개 중 40개 사용, 중복 0</td></tr>
<tr><th>제품</th><td>누끼 합성</td><td>원본 사진 + 대표컷 2장만 배경 교체(제품 픽셀 오차 0)</td></tr>
<tr><th>카피</th><td>방어적 고지 문구 다수</td><td>판매 문구 + 마지막 장에 확인사항 2개</td></tr>
</table></header>
<section class="cols">
<div class="col"><h2><span>BEFORE</span> 10/19</h2><img src="img/v2/01.png" alt="v2 01">
<img src="img/v2/02.png" alt="v2 02">
<img src="img/v2/03.png" alt="v2 03">
<img src="img/v2/04.png" alt="v2 04">
<img src="img/v2/05.png" alt="v2 05">
<img src="img/v2/06.png" alt="v2 06"></div>
<div class="col"><h2><span>AFTER</span> v4.1</h2><img src="img/v41/01.png" alt="v41 01">
<img src="img/v41/02.png" alt="v41 02">
<img src="img/v41/03.png" alt="v41 03">
<img src="img/v41/04.png" alt="v41 04">
<img src="img/v41/05.png" alt="v41 05">
<img src="img/v41/06.png" alt="v41 06">
<img src="img/v41/07.png" alt="v41 07">
<img src="img/v41/08.png" alt="v41 08">
<img src="img/v41/09.png" alt="v41 09">
<img src="img/v41/10.png" alt="v41 10">
<img src="img/v41/11.png" alt="v41 11">
<img src="img/v41/12.png" alt="v41 12"></div>
</section>
<script>
// 헤더 높이에 맞춰 열 제목 고정 위치 조정
const h=document.querySelector('header').offsetHeight;document.documentElement.style.setProperty('--hh',h+'px');
</script>
</body></html>

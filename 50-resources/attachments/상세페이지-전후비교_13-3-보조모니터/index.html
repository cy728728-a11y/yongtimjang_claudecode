<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>상세페이지 전후 비교 · 포터블 보조모니터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#2b2a28;--ink:#f3efe8;--sub:#bdb5a8;--accent:#c9a96e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:16px 24px 12px;border-bottom:1px solid #444}
h1{margin:0 0 8px;font-size:22px;font-weight:700}
.meta{font-size:14px;color:var(--sub)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:20px 24px;max-width:1800px;margin:0 auto}
.col h2{position:sticky;top:var(--hh,80px);background:var(--bg);margin:0 0 10px;padding:8px 0;font-size:18px;display:flex;justify-content:space-between}
.col h2 span{color:var(--accent)} .col h2 small{color:var(--sub);font-weight:400;font-size:13px}
.col img{display:block;width:100%;margin:0 0 6px;background:#fff}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
</style></head><body>
<header><h1>상세페이지 전후 비교 — 포터블 노트북 보조모니터</h1>

</section>
<script>const h=document.querySelector('header').offsetHeight;document.documentElement.style.setProperty('--hh',h+'px');</script>
</body></html>

<title>구매대행 마진 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 계산기 한 대 — 위 큰 결과창(LCD) · 가운데 입력 격자 · 아래 버튼 줄. 폰 한 화면에 들어오게 */
:root{
  --bg:#eef0f3; --fg:#1b1f26; --muted:#5e6878; --line:#d3d8e0; --panel:#ffffff;
  --lcd:#1c2230; --lcd-fg:#e9eef7; --lcd-dim:#8a95a8;
  --accent:#2f5bea; --accent-fg:#ffffff;
  --good:#2f6fed; --warn:#c98a00; --bad:#d6453d;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --fg:#e8ebf1; --muted:#9aa4b5; --line:#2a313d; --panel:#171c25;
  --lcd:#05070b; --lcd-fg:#f1f4fa; --lcd-dim:#7d889b; --accent:#5b82ff; --good:#6b93ff; --warn:#e0a526; --bad:#ff6b63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --fg:#e8ebf1; --muted:#9aa4b5; --line:#2a313d; --panel:#171c25;
  --lcd:#05070b; --lcd-fg:#f1f4fa; --lcd-dim:#7d889b; --accent:#5b82ff; --good:#6b93ff; --warn:#e0a526; --bad:#ff6b63; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-block:20px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.calc{max-width:460px;margin:0 auto;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
header small{color:var(--muted);font-size:12px}
.lcd{background:var(--lcd);color:var(--lcd-fg);border-radius:14px;padding:18px 20px 16px;display:grid;gap:10px;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.35);transition:box-shadow .25s}
.lcd.bad{box-shadow:inset 0 0 0 2px var(--bad),inset 0 2px 10px rgba(0,0,0,.35)}
.lcd.good{box-shadow:inset 0 0 0 2px var(--good),inset 0 2px 10px rgba(0,0,0,.35)}
.lcd .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lcd .lbl{color:var(--lcd-dim);font-size:12px;letter-spacing:.06em}
.lcd .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;font-size:18px}
.lcd .main .lbl{font-size:13px}
.lcd .main .val{font-size:clamp(34px,10vw,44px);font-weight:600;line-height:1.05}
.lcd .main .val.bad{color:var(--bad)} .lcd .main .val.good{color:var(--good)} .lcd .main .val.warn{color:var(--warn)}
.lcd .sub .val{color:var(--lcd-fg)}
.lcd .verdict{font-size:12px;color:var(--lcd-dim);min-height:1.4em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field .in{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;gap:6px}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:500 17px var(--mono);
  font-variant-numeric:tabular-nums;padding:9px 0;outline:none;text-align:right}
.field .in:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.field .unit{font-size:12px;color:var(--muted);white-space:nowrap}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:500 14px var(--sans);border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  padding:13px 10px;cursor:pointer;line-height:1.25}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;grid-column:1/-1}
button:active{transform:translateY(1px)}
.toast{font-size:12px;color:var(--muted);min-height:1.4em;text-align:center}
.note{font-size:12px;color:var(--muted);margin:0}
.copybox{font:13px var(--mono);white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px dashed var(--line);
  border-radius:9px;padding:10px;user-select:all}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="calc">
  <header>
    <h1>구매대행 마진 계산기</h1>
    <small>입력하면 바로 계산 · 예시 숫자 들어 있음</small>
  </header>

  <section class="lcd" id="lcd" aria-live="polite">
    <div class="row main"><span class="lbl">마진율</span><span class="val" id="o-margin">0.0%</span></div>
    <div class="row sub"><span class="lbl">순이익</span><span class="val" id="o-profit">0원</span></div>
    <div class="row sub"><span class="lbl">총원가 (상품+배송)</span><span class="val" id="o-cost">0원</span></div>
    <div class="row sub"><span class="lbl">네이버 수수료</span><span class="val" id="o-fee">0원</span></div>
    <div class="verdict" id="o-verdict"></div>
  </section>

  <section class="panel">
    <div class="grid">
      <div class="field"><label for="cny">타오바오 원가</label><div class="in"><input id="cny" type="number" inputmode="decimal" step="0.1" value="35"><span class="unit">위안</span></div></div>
      <div class="field"><label for="rate">환율 (1위안)</label><div class="in"><input id="rate" type="number" inputmode="decimal" step="1" value="195"><span class="unit">원</span></div></div>
      <div class="field"><label for="cnship">중국 내 배송비</label><div class="in"><input id="cnship" type="number" inputmode="decimal" step="1" value="8"><span class="unit">위안</span></div></div>
      <div class="field"><label for="intl">국제배송비</label><div class="in"><input id="intl" type="number" inputmode="numeric" step="100" value="7000"><span class="unit">원</span></div></div>
      <div class="field"><label for="price">네이버 판매가</label><div class="in"><input id="price" type="number" inputmode="numeric" step="100" value="29900"><span class="unit">원</span></div></div>
      <div class="field"><label for="fee">네이버 수수료율</label><div class="in"><input id="fee" type="number" inputmode="decimal" step="0.1" value="6"><span class="unit">%</span></div></div>
      <div class="field"><label for="target">목표 마진율</label><div class="in"><input id="target" type="number" inputmode="decimal" step="1" value="30"><span class="unit">%</span></div></div>
    </div>
  </section>

  <section class="btns">
    <button class="primary" id="b-reverse" type="button">목표 마진으로 판매가 역산</button>
    <button id="b-copy" type="button">카톡 요약 문구 복사</button>
    <button id="b-reset" type="button">초기화</button>
  </section>
  <div class="toast" id="toast"></div>
  <div class="copybox" id="copybox" hidden></div>

  <p class="note">마진율 = 순이익 ÷ 판매가. 20% 미만은 빨강, 30% 이상은 파랑. 관부가세는 미국 200달러·그 외 150달러 이하 면세 기준으로 넣지 않았다. 환율은 결제 카드사 고시가 아닌 내 기준값을 넣는다.</p>
</main>

<script>
(function(){
  var ids=['cny','rate','cnship','intl','price','fee','target'];
  var def={cny:35,rate:195,cnship:8,intl:7000,price:29900,fee:6,target:30};
  var $=function(id){return document.getElementById(id)};
  var won=function(n){return Math.round(n).toLocaleString('ko-KR')+'원'};
  var num=function(id){var v=parseFloat($(id).value);return isNaN(v)?0:v};
  var last={};
  function calc(){
    var cny=num('cny'),rate=num('rate'),cnship=num('cnship'),intl=num('intl'),price=num('price'),feeR=num('fee')/100;
    var goods=cny*rate, cnshipW=cnship*rate, cost=goods+cnshipW+intl;
    var fee=price*feeR, profit=price-cost-fee, margin=price>0?profit/price*100:0;
    last={cny:cny,rate:rate,goods:goods,cnship:cnship,cnshipW:cnshipW,intl:intl,cost:cost,price:price,feeR:feeR,fee:fee,profit:profit,margin:margin};
    $('o-margin').textContent=(margin<0?'-':'')+Math.abs(margin).toFixed(1)+'%';
    $('o-profit').textContent=won(profit);
    $('o-cost').textContent=won(cost);
    $('o-fee').textContent=won(fee);
    var lcd=$('lcd'),m=$('o-margin');lcd.className='lcd';m.className='val';
    var v='';
    if(price<=0){v='판매가를 넣어 줘.';}
    else if(margin<20){lcd.classList.add('bad');m.classList.add('bad');v='20% 미만. 광고비·반품 한 건이면 적자. 판매가를 올리거나 다른 상품.';}
    else if(margin>=30){lcd.classList.add('good');m.classList.add('good');v='30% 이상. 광고 붙여도 버틴다.';}
    else{m.classList.add('warn');v='20~30%. 광고 없이 자연 유입이면 가능, 광고 붙이면 빠듯.';}
    $('o-verdict').textContent=v;
  }
  function reverse(){
    var t=num('target')/100, feeR=num('fee')/100, cost=last.cost;
    var denom=1-feeR-t;
    if(denom<=0){toast('목표 마진과 수수료율의 합이 100%를 넘어 계산할 수 없어.');return}
    var p=Math.ceil(cost/denom/100)*100; // 100원 단위 올림
    $('price').value=p;calc();
    toast('목표 '+num('target')+'%를 맞추는 판매가 '+won(p)+' (100원 단위 올림)');
  }
  function summary(){
    var L=last;
    return '[마진 계산]\n'
      +'원가 '+L.cny+'위안 ×'+L.rate+' = '+won(L.goods)+'\n'
      +'중국배송 '+L.cnship+'위안 = '+won(L.cnshipW)+'\n'
      +'국제배송 '+won(L.intl)+'\n'
      +'총원가 '+won(L.cost)+'\n'
      +'판매가 '+won(L.price)+' / 수수료 '+(L.feeR*100).toFixed(1)+'% '+won(L.fee)+'\n'
      +'순이익 '+won(L.profit)+' (마진 '+L.margin.toFixed(1)+'%)';
  }
  function copy(){
    var txt=summary(), box=$('copybox');
    box.textContent=txt;
    function done(){toast('복사됐어. 카톡에 붙여 넣으면 돼.');box.hidden=true}
    function fail(){box.hidden=false;toast('자동 복사가 막혀 있어. 아래 글을 길게 눌러 복사해.');
      try{var r=document.createRange();r.selectNodeContents(box);var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
    try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}
  }
  function reset(){ids.forEach(function(id){$(id).value=def[id]});$('copybox').hidden=true;calc();toast('예시 숫자로 되돌렸어.')}
  var tm;function toast(s){$('toast').textContent=s;clearTimeout(tm);tm=setTimeout(function(){$('toast').textContent=''},4000)}
  ids.forEach(function(id){$(id).addEventListener('input',calc)});
  $('b-reverse').addEventListener('click',reverse);
  $('b-copy').addEventListener('click',copy);
  $('b-reset').addEventListener('click',reset);
  calc();
})();
</script>

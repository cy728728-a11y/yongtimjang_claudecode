<title>국기 원정대</title>
<style>
:root{
  --parchment:#F2E9D8;
  --parchment-2:#E8DCC3;
  --ink:#241F16;
  --ink-soft:#5B5340;
  --navy:#14213D;
  --navy-2:#1D2E52;
  --gold:#C08A2E;
  --gold-soft:#DCB05F;
  --teal:#3F6259;
  --wrong:#A8412F;
  --right:#3F6E4A;
  --line:rgba(36,31,22,0.16);
  --card-bg:#FFFDF7;
  --shadow:rgba(36,31,22,0.18);
  --sea:#DCE8EA;
  --land:#CDBF9F;
  --land-other:#E4DAC4;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --parchment:#141821;
    --parchment-2:#1B2029;
    --ink:#EDE6D6;
    --ink-soft:#B7AE99;
    --navy:#0C1220;
    --navy-2:#182238;
    --gold:#D9A94E;
    --gold-soft:#E9C783;
    --teal:#7FA595;
    --wrong:#D97361;
    --right:#79B888;
    --line:rgba(237,230,214,0.14);
    --card-bg:#1B2130;
    --shadow:rgba(0,0,0,0.45);
    --sea:#101A26;
    --land:#4A4536;
    --land-other:#2A2D33;
  }
}
:root[data-theme="dark"]{
  --parchment:#141821;
  --parchment-2:#1B2029;
  --ink:#EDE6D6;
  --ink-soft:#B7AE99;
  --navy:#0C1220;
  --navy-2:#182238;
  --gold:#D9A94E;
  --gold-soft:#E9C783;
  --teal:#7FA595;
  --wrong:#D97361;
  --right:#79B888;
  --line:rgba(237,230,214,0.14);
  --card-bg:#1B2130;
  --shadow:rgba(0,0,0,0.45);
  --sea:#101A26;
  --land:#4A4536;
  --land-other:#2A2D33;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(1100px 700px at 12% -8%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 60%),
    var(--parchment);
  color:var(--ink);
  font-family:"Libre Franklin", -apple-system, "Segoe UI", sans-serif;
  padding:32px 20px 56px;
  min-height:100vh;
}
.stage{max-width:640px;margin:0 auto;}

h1,h2,h3{font-family:"Fraunces","Noto Serif KR",serif;text-wrap:balance;margin:0;}

/* header */
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;border-bottom:2px solid var(--line);padding-bottom:16px;}
.masthead .title{font-size:1.65rem;font-weight:600;letter-spacing:0.01em;}
.masthead .subtitle{font-size:0.8rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;}
.masthead .badge{font-family:"Fraunces",serif;font-style:italic;color:var(--teal);font-size:0.95rem;}

/* progress + stats row */
.hud{display:flex;align-items:center;gap:14px;margin-bottom:26px;}
.hud .track{flex:1;height:8px;border-radius:99px;background:var(--parchment-2);overflow:hidden;border:1px solid var(--line);}
.hud .fill{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));width:0%;transition:width .45s ease;}
.hud .count{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:0.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.hud .score{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:0.9rem;font-weight:600;color:var(--navy-2);background:var(--parchment-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums;}
:root:not([data-theme="light"]) .hud .score{color:var(--gold-soft);}
:root[data-theme="dark"] .hud .score{color:var(--gold-soft);}
.hud .back{font-family:"Libre Franklin",sans-serif;font-size:0.78rem;color:var(--ink-soft);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;white-space:nowrap;}
.hud .back:hover{border-color:var(--gold-soft);color:var(--ink);}

/* card */
.card{
  background:var(--card-bg);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 18px 40px -22px var(--shadow);
  padding:38px 30px 30px;
}
.mode-tag{display:inline-block;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--teal);border:1px solid color-mix(in srgb, var(--teal) 45%, transparent);border-radius:99px;padding:3px 11px;margin-bottom:18px;}
.flag-wrap{display:flex;justify-content:center;margin-bottom:8px;}
.flag{width:200px;max-width:70%;height:auto;border-radius:6px;border:1px solid var(--line);box-shadow:0 14px 26px -12px var(--shadow);}
.prompt{text-align:center;font-size:1.28rem;font-weight:600;margin:14px 0 28px;padding:0 8px;}

.landmark-wrap{display:flex;justify-content:center;margin-bottom:8px;}
.landmark-card{
  background:linear-gradient(160deg, color-mix(in srgb, var(--gold) 14%, var(--parchment)), var(--parchment));
  border:1.5px dashed var(--gold-soft);
  border-radius:14px;
  padding:28px 24px;
  text-align:center;
  max-width:90%;
}
.landmark-card .eyebrow{font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal);margin-bottom:8px;}
.landmark-card .lname{font-family:"Fraunces",serif;font-weight:600;font-size:1.7rem;color:var(--ink);text-wrap:balance;}

.choices{display:grid;grid-template-columns:1fr;gap:10px;}
.choice{
  font-family:inherit;font-size:1.08rem;text-align:left;
  background:var(--parchment);
  border:1.5px solid var(--line);
  border-radius:11px;
  padding:15px 16px;
  color:var(--ink);
  cursor:pointer;
  display:flex;align-items:center;gap:12px;
  transition:border-color .15s, background .15s, transform .1s;
}
.choice .letter{font-family:"Fraunces",serif;font-weight:600;color:var(--gold);width:1.3em;flex:none;}
.choice:hover:not(:disabled){border-color:var(--gold-soft);transform:translateY(-1px);}
.choice:disabled{cursor:default;}
.choice.correct{background:color-mix(in srgb, var(--right) 18%, var(--card-bg));border-color:var(--right);}
.choice.correct .letter{color:var(--right);}
.choice.wrong{background:color-mix(in srgb, var(--wrong) 16%, var(--card-bg));border-color:var(--wrong);}
.choice.wrong .letter{color:var(--wrong);}
.choice.dim{opacity:0.55;}

.feedback{min-height:1.4em;text-align:center;margin-top:18px;font-size:0.95rem;font-weight:600;}
.feedback.correct{color:var(--right);}
.feedback.wrong{color:var(--wrong);}

.next-btn{display:block;margin:20px auto 0;font-family:"Fraunces",serif;font-weight:600;font-size:0.98rem;background:var(--navy);color:var(--parchment);border:none;border-radius:99px;padding:11px 30px;cursor:pointer;transition:transform .12s, background .15s;}
.next-btn:hover{background:var(--navy-2);transform:translateY(-1px);}
:root:not([data-theme="light"]) .next-btn{background:var(--gold);color:#1B1404;}
:root:not([data-theme="light"]) .next-btn:hover{background:var(--gold-soft);}
:root[data-theme="dark"] .next-btn{background:var(--gold);color:#1B1404;}
:root[data-theme="dark"] .next-btn:hover{background:var(--gold-soft);}

/* start screen */
.continent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px;}
@media (max-width:460px){.continent-grid{grid-template-columns:1fr;}}
.cbtn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--parchment);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;cursor:pointer;text-align:left;color:var(--ink);
  font-family:inherit;transition:border-color .15s, transform .1s, background .15s;
}
.cbtn:hover{border-color:var(--gold-soft);transform:translateY(-1px);}
.cbtn.active{background:color-mix(in srgb, var(--gold) 20%, var(--card-bg));border-color:var(--gold);}
.cbtn .cname{font-weight:600;font-size:1rem;}
.cbtn .cicon{font-size:1.5rem;}
.cbtn .ccount{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:0.75rem;color:var(--ink-soft);}

.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--parchment);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin-bottom:24px;}
.toggle-row .label{font-size:0.92rem;font-weight:600;}
.toggle-row .desc{font-size:0.78rem;color:var(--ink-soft);margin-top:2px;}
.switch{position:relative;width:46px;height:26px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.switch .slider{position:absolute;inset:0;background:var(--parchment-2);border:1px solid var(--line);border-radius:99px;cursor:pointer;transition:background .15s;}
.switch .slider::before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:var(--card-bg);border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px var(--shadow);}
.switch input:checked + .slider{background:var(--teal);}
.switch input:checked + .slider::before{transform:translateX(20px);}

.start-btn{display:block;width:100%;font-family:"Fraunces",serif;font-weight:600;font-size:1.1rem;background:var(--navy);color:var(--parchment);border:none;border-radius:14px;padding:16px;cursor:pointer;transition:transform .12s, background .15s;}
.start-btn:hover{background:var(--navy-2);transform:translateY(-1px);}
:root:not([data-theme="light"]) .start-btn{background:var(--gold);color:#1B1404;}
:root:not([data-theme="light"]) .start-btn:hover{background:var(--gold-soft);}
:root[data-theme="dark"] .start-btn{background:var(--gold);color:#1B1404;}
:root[data-theme="dark"] .start-btn:hover{background:var(--gold-soft);}

.hint{text-align:center;font-size:0.82rem;color:var(--ink-soft);margin-top:14px;}

.player-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:22px;}
@media (max-width:460px){.player-grid{grid-template-columns:1fr;}}
.pbtn{
  display:flex;align-items:center;gap:10px;
  background:var(--parchment);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;cursor:pointer;text-align:left;color:var(--ink);
  font-family:inherit;font-weight:600;font-size:0.98rem;transition:border-color .15s, transform .1s, background .15s;
}
.pbtn:hover{border-color:var(--gold-soft);transform:translateY(-1px);}
.pbtn.active{background:color-mix(in srgb, var(--teal) 22%, var(--card-bg));border-color:var(--teal);}
.pbtn .picon{font-size:1.4rem;}
.pbtn .pcheck{margin-left:auto;font-size:0.95rem;color:var(--teal);visibility:hidden;}
.pbtn.active .pcheck{visibility:visible;}
.step-label{font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-soft);margin:22px 0 10px;}
.step-label:first-of-type{margin-top:0;}

.turn-banner{display:flex;align-items:center;justify-content:center;gap:8px;font-family:"Fraunces",serif;font-weight:600;font-size:1rem;color:var(--teal);margin-bottom:14px;}
.turn-banner .picon{font-size:1.25rem;}

.score-board{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0 4px;}
.score-chip{display:flex;align-items:center;gap:6px;background:var(--parchment);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:0.82rem;}
.score-chip .pts{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600;font-variant-numeric:tabular-nums;color:var(--navy-2);}
:root:not([data-theme="light"]) .score-chip .pts{color:var(--gold-soft);}
:root[data-theme="dark"] .score-chip .pts{color:var(--gold-soft);}
.score-chip.leader{border-color:var(--gold);}
.score-chip.leader .pts::before{content:"👑 ";}

/* results */
.results{text-align:center;}
.results .tally{font-family:"Fraunces",serif;font-size:3.4rem;font-weight:600;margin:6px 0 2px;color:var(--navy-2);}
:root:not([data-theme="light"]) .results .tally{color:var(--gold-soft);}
:root[data-theme="dark"] .results .tally{color:var(--gold-soft);}
.results .rank{font-style:italic;font-family:"Fraunces",serif;color:var(--teal);margin-bottom:22px;font-size:1.1rem;}
.miss-list{text-align:left;border-top:1px dashed var(--line);margin-top:22px;padding-top:16px;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;}
.miss-row{display:flex;gap:10px;align-items:baseline;font-size:0.9rem;}
.miss-row .f{width:28px;height:auto;border-radius:3px;border:1px solid var(--line);flex:none;}
.miss-row .name{font-weight:600;}
.miss-row .ans{color:var(--ink-soft);}
.miss-row .correct-ans{color:var(--right);}
.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.results-actions .next-btn{margin:0;}
.results-actions .ghost-btn{
  font-family:"Fraunces",serif;font-weight:600;font-size:0.98rem;background:transparent;color:var(--ink);
  border:1.5px solid var(--line);border-radius:99px;padding:11px 26px;cursor:pointer;transition:border-color .15s;
}
.results-actions .ghost-btn:hover{border-color:var(--gold-soft);}

footer.note{text-align:center;color:var(--ink-soft);font-size:0.78rem;margin-top:22px;letter-spacing:0.02em;}

@media (max-width:420px){
  .flag{width:150px;}
  .card{padding:28px 18px 24px;}
}
/* ---------- 지도 퀴즈 ---------- */
.mq-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--parchment);border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;cursor:pointer;color:var(--ink);font-family:inherit;font-weight:700;font-size:1rem;transition:border-color .15s,background .15s;}
.mbtn:hover{border-color:var(--gold-soft);}
.mbtn.active{background:color-mix(in srgb, var(--gold) 20%, var(--card-bg));border-color:var(--gold);}
.mbtn .micon{font-size:1.4rem;}
.mq-prompt{display:flex;align-items:center;justify-content:center;gap:12px;text-align:left;font-size:1.1rem;font-weight:600;margin:4px 0 12px;}
.mq-prompt small{display:block;font-weight:400;color:var(--ink-soft);font-size:.8rem;margin-top:2px;}
.mq-flag{width:64px;height:auto;flex:none;border-radius:4px;border:1px solid var(--line);}
.mq-map{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sea);margin-bottom:12px;}
.mq-map svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;}
.mq-land{fill:var(--land-other);stroke:var(--card-bg);stroke-width:.6;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s;}
.mq-land.mq-quiz{fill:var(--land);}
@media (hover:hover){.mq-land:hover{fill:var(--gold-soft);}}
.mq-land.mq-cont{fill:var(--gold);animation:mqpulse .9s ease-in-out 3;}
.mq-land.mq-m1{fill:color-mix(in srgb, var(--teal) 35%, var(--land));}
.mq-land.mq-m2{fill:color-mix(in srgb, var(--teal) 70%, var(--land));}
.mq-land.mq-m3{fill:var(--teal);}
.mq-land.mq-target{fill:var(--gold);animation:mqpulse .9s ease-in-out 4;}
.mq-land.mq-correct{fill:var(--right);}
.mq-land.mq-wrong{fill:var(--wrong);}
.mq-dot{cursor:pointer;}
.mq-dot .mq-hit{fill:transparent;}
.mq-dot .mq-pin{fill:var(--land);stroke:var(--ink-soft);stroke-width:1;vector-effect:non-scaling-stroke;}
.mq-dot.mq-m1 .mq-pin{fill:color-mix(in srgb, var(--teal) 35%, var(--land));}
.mq-dot.mq-m2 .mq-pin{fill:color-mix(in srgb, var(--teal) 70%, var(--land));}
.mq-dot.mq-m3 .mq-pin{fill:var(--teal);}
.mq-dot.mq-target .mq-pin{fill:var(--gold);}
.mq-dot.mq-correct .mq-pin{fill:var(--right);}
.mq-dot.mq-wrong .mq-pin{fill:var(--wrong);}
@keyframes mqpulse{50%{opacity:.45;}}
.mq-star{text-anchor:middle;dominant-baseline:central;pointer-events:none;}
.mq-label{font-family:"Libre Franklin",-apple-system,sans-serif;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--card-bg);stroke-linejoin:round;text-anchor:middle;pointer-events:none;}
.mq-label.mq-label-soft{fill:var(--ink-soft);font-weight:500;}
.mq-label.mq-label-wrong{fill:var(--wrong);}
.mq-review{background:var(--parchment);border:1.5px dashed var(--gold-soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:.92rem;line-height:1.55;}
.mq-review-title{font-weight:700;margin-bottom:2px;}
.mq-nb{color:var(--ink-soft);font-size:.85rem;margin-top:4px;}
.mq-atlas-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.mq-atlas-stats{text-align:center;margin:0 0 10px;font-size:.95rem;}
.mq-atlas-stats span{color:var(--ink-soft);}
.mq-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;font-size:.78rem;color:var(--ink-soft);margin-bottom:6px;}
.mq-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;border:1px solid var(--line);}
.mq-legend .lg0{background:var(--land);}
.mq-legend .lg1{background:color-mix(in srgb, var(--teal) 35%, var(--land));}
.mq-legend .lg2{background:color-mix(in srgb, var(--teal) 70%, var(--land));}
.mq-legend .lg3{background:var(--teal);}
.mq-error{color:var(--wrong);text-align:center;font-size:.9rem;margin-top:10px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Libre+Franklin:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">

<div class="stage">
  <div class="masthead">
    <div>
      <div class="title">국기 원정대</div>
      <div class="subtitle">Flag &amp; Capital Expedition</div>
    </div>
    <div class="badge" id="roundBadge">대륙을 골라보세요</div>
  </div>

  <div class="hud" id="hud" hidden>
    <button class="back" id="backBtn">← 대륙 선택</button>
    <span class="count" id="qCount">문항 1 / 10</span>
    <div class="track"><div class="fill" id="progressFill"></div></div>
    <span class="score" id="scoreBox">0 pt</span>
  </div>

  <div class="card" id="card"></div>

  <footer class="note" id="footNote">카드에 있는 112장의 국기 중 대륙을 골라 5지선다로 맞혀보세요.</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="js/countries.js"></script>
<script src="js/progress.js"></script>
<script src="js/mapquiz-logic.js"></script>
<script src="js/store.js"></script>
<script src="js/mapview.js"></script>
<script src="js/mapquiz.js"></script>
<script>
(function(){
"use strict";

/* 대륙 7장 카드 + 국기 105장 = 총 112장 구성을 그대로 옮겼어요 */
var CONTINENTS = MQData.CONTINENTS;
var COUNTRIES = MQData.COUNTRIES;

var letters = ["A","B","C","D","E"];
var QUESTIONS_PER_PLAYER = 10;

var PLAYERS = [
  {key:"dad",  name:"아빠", icon:"👨"},
  {key:"mom",  name:"엄마", icon:"👩"},
  {key:"seoi", name:"서이", icon:"🧒"},
  {key:"seoha",name:"서하", icon:"👦"}
];

var state = {
  screen: "start",     // start | quiz | results
  mode: "flag",        // flag | map
  selectedPlayers: PLAYERS.map(function(p){return p.key;}),
  turnOrder: [],
  scores: {},
  selectedContinents: CONTINENTS.map(function(c){return c.key;}),
  askCapitals: false,
  askLandmarks: true,
  askContinents: false,
  totalQ: 10,
  quiz: [],
  current: 0,
  score: 0,
  answered: false
};

function playerByKey(key){
  return PLAYERS.filter(function(p){return p.key===key;})[0];
}

function flagSrc(emoji){
  var cps = Array.from(emoji);
  var a = cps[0].codePointAt(0) - 0x1F1E6 + 65;
  var b = cps[1].codePointAt(0) - 0x1F1E6 + 65;
  var iso = String.fromCharCode(a, b).toLowerCase();
  return "flags/" + iso + ".svg";
}

function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function continentNameByKey(key){
  var c = CONTINENTS.filter(function(x){return x.key===key;})[0];
  return c ? c.name : key;
}

function poolFor(keys){
  if(keys.length === CONTINENTS.length) return COUNTRIES;
  return COUNTRIES.filter(function(c){ return keys.indexOf(c.continent) > -1; });
}

function continentLabel(keys){
  if(keys.length === CONTINENTS.length) return "전체 국기 105장";
  if(keys.length === 0) return "없음";
  return keys.map(continentNameByKey).join(" · ");
}

/* ---------- start screen ---------- */
function renderStart(){
  document.getElementById("hud").hidden = true;
  document.getElementById("roundBadge").textContent = "누가 도전할까요?";
  document.getElementById("footNote").textContent = state.mode === "map"
    ? "대륙을 누르고 나라를 찾아요. 맞힐수록 내 세계지도가 색칠돼요."
    : "참가자와 대륙을 고르고 5지선다로 국기를 맞혀보세요.";

  var card = document.getElementById("card");
  var html = '<div class="mq-modes">' +
    '<button class="mbtn' + (state.mode === "flag" ? " active" : "") + '" data-mode="flag"><span class="micon">🚩</span>국기 퀴즈</button>' +
    '<button class="mbtn' + (state.mode === "map" ? " active" : "") + '" data-mode="map"><span class="micon">🗺️</span>지도 퀴즈</button>' +
    '</div>';
  html += '<div class="mode-tag">오늘의 참가자</div>';
  html += '<div class="player-grid">';
  PLAYERS.forEach(function(p){
    var active = state.selectedPlayers.indexOf(p.key) > -1 ? " active" : "";
    html += '<button class="pbtn' + active + '" data-pkey="' + p.key + '">' +
      '<span class="picon">' + p.icon + '</span><span>' + p.name + '</span>' +
      '<span class="pcheck">✓</span></button>';
  });
  html += '</div>';

  var allSelected = state.selectedContinents.length === CONTINENTS.length;
  html += '<div class="step-label">대륙 선택 <span style="text-transform:none;letter-spacing:0;color:var(--ink-soft);">(여러 개 선택 가능)</span></div>';
  html += '<div class="continent-grid">';
  html += continentBtn("all", "🌍", "전체", 105, allSelected);
  CONTINENTS.forEach(function(c){
    html += continentBtn(c.key, c.icon, c.name, c.count, state.selectedContinents.indexOf(c.key) > -1);
  });
  html += '</div>';

  if (state.mode === "flag") {
    html += '<div class="toggle-row"><div><div class="label">수도 문제도 섞기</div><div class="desc">끄면 국기 → 나라 이름만 물어봐요</div></div>' +
      '<label class="switch"><input type="checkbox" id="capitalToggle"' + (state.askCapitals ? " checked" : "") + '><span class="slider"></span></label></div>';

    html += '<div class="toggle-row"><div><div class="label">랜드마크 문제도 섞기</div><div class="desc">"세계의 랜드마크" 책 속 대표 건축물로 나라 맞히기</div></div>' +
      '<label class="switch"><input type="checkbox" id="landmarkToggle"' + (state.askLandmarks ? " checked" : "") + '><span class="slider"></span></label></div>';

    var continentToggleDisabled = state.selectedContinents.length < 2;
    html += '<div class="toggle-row"><div><div class="label">대륙 맞히기도 섞기</div><div class="desc">' +
      (continentToggleDisabled ? '대륙을 2개 이상 골라야 이 문제가 나와요' : '국기를 보고 어느 대륙 나라인지 맞혀요') + '</div></div>' +
      '<label class="switch"><input type="checkbox" id="continentToggle"' + (state.askContinents ? " checked" : "") + (continentToggleDisabled ? " disabled" : "") + '><span class="slider"></span></label></div>';
  } else {
    html += '<div class="step-label">내 세계지도</div><div class="mq-atlas-row">' +
      state.selectedPlayers.map(function (k) {
        var p = playerByKey(k);
        return '<button class="ghost-btn mq-atlas-btn" data-atlas="' + k + '" style="font-family:inherit;font-size:.9rem;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;">' + p.icon + ' ' + p.name + '</button>';
      }).join("") + '</div>';
  }

  html += '<button class="start-btn" id="startBtn">' + (state.mode === "map" ? "지도 탐험 시작 🗺️" : "게임 시작하기 🚩") + '</button>';
  html += '<div class="mq-error" id="mqError" hidden></div>';
  var playerNames = state.selectedPlayers.map(function(k){return playerByKey(k).name;}).join(" · ");
  var totalPreview = QUESTIONS_PER_PLAYER * state.selectedPlayers.length;
  html += '<div class="hint">참가자: <strong>' + (playerNames || "없음") + '</strong> · 대륙: <strong>' + continentLabel(state.selectedContinents) + '</strong></div>';
  html += '<div class="hint">참가자 1명당 ' + QUESTIONS_PER_PLAYER + '문제씩, 총 ' + (totalPreview || 0) + '문제</div>';

  card.innerHTML = html;

  card.querySelectorAll(".pbtn").forEach(function(b){
    b.addEventListener("click", function(){
      var key = b.getAttribute("data-pkey");
      var idx = state.selectedPlayers.indexOf(key);
      if(idx > -1){ state.selectedPlayers.splice(idx,1); }
      else { state.selectedPlayers.push(key); }
      renderStart();
    });
  });
  var buttons = card.querySelectorAll(".cbtn");
  buttons.forEach(function(b){
    b.addEventListener("click", function(){
      var key = b.getAttribute("data-key");
      if(key === "all"){
        state.selectedContinents = CONTINENTS.map(function(c){return c.key;});
      } else {
        var idx = state.selectedContinents.indexOf(key);
        if(idx > -1){ state.selectedContinents.splice(idx,1); }
        else { state.selectedContinents.push(key); }
      }
      renderStart();
    });
  });
  if (state.mode === "flag") {
    document.getElementById("capitalToggle").addEventListener("change", function(e){
      state.askCapitals = e.target.checked;
    });
    document.getElementById("landmarkToggle").addEventListener("change", function(e){
      state.askLandmarks = e.target.checked;
    });
    var continentToggleEl = document.getElementById("continentToggle");
    if(continentToggleEl && !continentToggleEl.disabled){
      continentToggleEl.addEventListener("change", function(e){
        state.askContinents = e.target.checked;
      });
    }
  }
  card.querySelectorAll(".mbtn").forEach(function(b){
    b.addEventListener("click", function(){
      state.mode = b.getAttribute("data-mode");
      renderStart();
    });
  });
  card.querySelectorAll(".mq-atlas-btn").forEach(function(b){
    b.addEventListener("click", function(){
      var key = b.getAttribute("data-atlas");
      var p = playerByKey(key);
      withMap(function(){
        // 불러오는 동안 그 플레이어를 뺐으면 열지 않음
        if(state.selectedPlayers.indexOf(key) === -1) return;
        MQMapQuiz.renderAtlas(card, p, renderStart);
      });
    });
  });
  document.getElementById("startBtn").addEventListener("click", function(){
    if(state.selectedPlayers.length === 0){
      showStartError("참가자를 한 명 이상 골라주세요!");
      return;
    }
    if(state.selectedContinents.length === 0){
      showStartError("대륙을 한 개 이상 골라주세요!");
      return;
    }
    if(state.mode === "map"){
      withMap(beginGame);
    } else {
      beginGame();
    }
  });
}

/* 시작 화면 안내 문구 (아티팩트 화면에서는 alert 이 뜨지 않음) */
function showStartError(msg){
  var err = document.getElementById("mqError");
  if(err){ err.hidden = false; err.textContent = msg; }
}

/* 지도 파일·기록을 불러온 뒤 실행 (실패하면 시작 화면에 안내)
   불러오는 동안(최대 수 초) 화면이 바뀌었으면 실행하지 않음:
   시작 화면·지도 모드·참가자 1명 이상일 때만, 그리고 가장 마지막 요청만 */
var mapReq = 0;
function withMap(fn){
  var my = ++mapReq;
  var btn = document.getElementById("startBtn");
  var err = document.getElementById("mqError");
  if(btn){ btn.disabled = true; btn.textContent = "지도 불러오는 중…"; }
  // ready() 실패만 여기서 안내 (fn 안의 오류는 삼키지 않음 → 콘솔에 그대로)
  MQMapQuiz.ready(PLAYERS.map(function(p){ return p.key; })).then(function(){
    if(btn){ btn.disabled = false; btn.textContent = "지도 탐험 시작 🗺️"; }
    if(my !== mapReq || state.screen !== "start" || state.mode !== "map" || state.selectedPlayers.length === 0) return;
    fn();
  }, function(e){
    if(btn){ btn.disabled = false; btn.textContent = "지도 탐험 시작 🗺️"; }
    if(err){ err.hidden = false; err.textContent = "지도를 못 불러왔어요: " + e.message; }
  });
}

/* 게임 시작 (처음·다시하기 공통)
   지도 모드는 시작 전에 참가자 기록을 db 에서 다시 읽음 (오래 열어 둔 탭이 옛 기록으로 시작하지 않게)
   읽는 동안 화면이 바뀌었거나 다시 눌렀으면 이전 요청은 버림 */
function beginGame(){
  var my = ++mapReq;
  if(state.mode !== "map"){ startGame(); return; }
  var scr = state.screen;
  MQMapQuiz.refresh(state.selectedPlayers).then(function(){
    if(my !== mapReq || state.screen !== scr || state.mode !== "map" || state.selectedPlayers.length === 0) return;
    startGame();
  });
}

function startGame(){
  state.turnOrder = shuffle(state.selectedPlayers);
  state.totalQ = QUESTIONS_PER_PLAYER * state.turnOrder.length;
  if(state.mode === "map"){ state.quiz = []; }
  else { buildQuiz(poolFor(state.selectedContinents)); }
  state.scores = {};
  state.turnOrder.forEach(function(k){ state.scores[k] = 0; });
  state.screen = "quiz";
  state.current = 0;
  state.score = 0;
  document.getElementById("hud").hidden = false;
  renderQuiz();
}

/* 다음 문항 버튼 */
function appendNextButton(){
  var nextBtn = document.createElement("button");
  nextBtn.className = "next-btn";
  nextBtn.textContent = state.current === state.totalQ - 1 ? "결과 보기" : "다음 문항";
  nextBtn.addEventListener("click", function(){
    state.current++;
    if(state.current >= state.totalQ){ renderResults(); }
    else { renderQuiz(); }
  });
  document.getElementById("card").appendChild(nextBtn);
}

/* 지도 문제 한 개 */
function renderMapQuiz(){
  var turnKey = state.turnOrder[state.current % state.turnOrder.length];
  state.answered = false;
  MQMapQuiz.renderQuestion(document.getElementById("card"), {
    playerKey: turnKey,
    player: playerByKey(turnKey),
    contKeys: state.selectedContinents,
    onDone: function(r){
      state.answered = true;
      state.score += r.points;
      state.scores[turnKey] += r.points;
      state.quiz.push({ country:r.country, type:"map", userAnswer:r.userAnswer, correct:r.correctAnswer, wasCorrect:r.correct, turnKey:turnKey });
      document.getElementById("scoreBox").textContent = state.score + " pt";
      renderScoreBoard();
      appendNextButton();
    }
  });
  renderScoreBoard();
}

function continentBtn(key, icon, name, count, isActive){
  var active = isActive ? " active" : "";
  return '<button class="cbtn' + active + '" data-key="' + key + '">' +
    '<span class="cicon">' + icon + '</span>' +
    '<span style="flex:1"><span class="cname">' + name + '</span><br><span class="ccount">국기 ' + count + '장</span></span>' +
    '</button>';
}

/* ---------- quiz ---------- */
function pickWithRepeats(pool, count){
  var picks = [];
  while(picks.length < count){
    var batch = shuffle(pool);
    picks = picks.concat(batch);
  }
  return picks.slice(0, count);
}

function buildQuiz(pool){
  var picks = pickWithRepeats(pool, state.totalQ);
  state.quiz = picks.map(function(c){
    var types = ["name"];
    if(state.askCapitals) types.push("capital");
    if(state.askLandmarks && c.landmark){ types.push("landmark"); types.push("landmarkName"); }
    if(state.askContinents && state.selectedContinents.length > 1) types.push("continent");
    var type = types[Math.floor(Math.random()*types.length)];

    if(type === "continent"){
      var correctContinent = continentNameByKey(c.continent);
      var otherContinents = shuffle(CONTINENTS.filter(function(x){return x.key !== c.continent;}).map(function(x){return x.name;}));
      var cOptions = shuffle([correctContinent].concat(otherContinents.slice(0,4)));
      return { country:c, type:type, correct:correctContinent, options:cOptions };
    }

    var field = type === "capital" ? "capital" : type === "landmarkName" ? "landmark" : "name";
    var correct = c[field];

    var basePool = (type === "landmark" || type === "landmarkName") ? pool.filter(function(o){return o.landmark;}) : pool;
    var distractorPool = shuffle(basePool.filter(function(o){return o[field] !== correct;}));
    if(distractorPool.length < 4){
      var fallback = (type === "landmark" || type === "landmarkName") ? COUNTRIES.filter(function(o){return o.landmark;}) : COUNTRIES;
      distractorPool = shuffle(fallback.filter(function(o){return o[field] !== correct;}));
    }
    var options = shuffle([correct].concat(distractorPool.slice(0,4).map(function(o){return o[field];})));
    return { country:c, type:type, correct:correct, options:options };
  });
}

function renderQuiz(){
  document.getElementById("roundBadge").textContent = continentLabel(state.selectedContinents);
  document.getElementById("footNote").textContent = "국기를 보고 나라 이름 또는 수도를 5지선다로 맞혀보세요.";
  document.getElementById("qCount").textContent = "문항 " + (state.current+1) + " / " + state.totalQ;
  document.getElementById("scoreBox").textContent = state.score + " pt";
  document.getElementById("progressFill").style.width = ((state.current)/state.totalQ*100) + "%";
  if(state.mode === "map"){
    document.getElementById("footNote").textContent = "지도에서 나라를 찾아보세요. 맞힐수록 내 세계지도가 색칠돼요.";
    renderMapQuiz();
    return;
  }
  var q = state.quiz[state.current];

  var turnKey = state.turnOrder[state.current % state.turnOrder.length];
  var turnPlayer = playerByKey(turnKey);

  var modeLabel = q.type === "capital" ? "수도 맞히기" :
    q.type === "landmark" ? "랜드마크 맞히기" :
    q.type === "landmarkName" ? "랜드마크 맞히기" :
    q.type === "continent" ? "대륙 맞히기" : "나라 이름 맞히기";
  var promptText = q.type === "capital" ? "이 나라의 수도는 어디일까요?" :
    q.type === "landmark" ? "이 랜드마크는 어느 나라에 있을까요?" :
    q.type === "landmarkName" ? "이 나라의 랜드마크는 무엇일까요?" :
    q.type === "continent" ? "이 나라는 어느 대륙에 있을까요?" :
    "이 국기는 어느 나라의 국기일까요?";
  var visualHtml = q.type === "landmark"
    ? '<div class="landmark-wrap"><div class="landmark-card"><div class="eyebrow">세계의 랜드마크</div><div class="lname">' + q.country.landmark + '</div></div></div>'
    : '<div class="flag-wrap"><img class="flag" src="' + flagSrc(q.country.flag) + '" alt="국기"></div>';

  var card = document.getElementById("card");
  card.innerHTML =
    '<div class="mode-tag">' + modeLabel + '</div>' +
    '<div class="turn-banner"><span class="picon">' + turnPlayer.icon + '</span>' + turnPlayer.name + '의 차례!</div>' +
    visualHtml +
    '<div class="prompt">' + promptText + '</div>' +
    '<div class="choices" id="choices"></div>' +
    '<div class="feedback" id="feedback"></div>' +
    '<div class="score-board" id="scoreBoard"></div>';
  renderScoreBoard();

  var choicesEl = document.getElementById("choices");
  q.options.forEach(function(opt, i){
    var btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + opt + '</span>';
    btn.addEventListener("click", function(){ selectAnswer(opt, btn); });
    choicesEl.appendChild(btn);
  });
  state.answered = false;
}

function renderScoreBoard(){
  var board = document.getElementById("scoreBoard");
  if(!board) return;
  var maxScore = Math.max.apply(null, state.turnOrder.map(function(k){return state.scores[k];}));
  board.innerHTML = state.turnOrder.map(function(k){
    var p = playerByKey(k);
    var isLeader = state.scores[k] === maxScore && maxScore > 0;
    return '<span class="score-chip' + (isLeader?" leader":"") + '">' + p.icon + ' ' + p.name +
      ' <span class="pts">' + state.scores[k] + '</span></span>';
  }).join("");
}

function selectAnswer(opt, btn){
  if(state.answered) return;
  state.answered = true;
  var q = state.quiz[state.current];
  var isCorrect = opt === q.correct;
  var turnKey = state.turnOrder[state.current % state.turnOrder.length];
  if(isCorrect){
    state.score += 10;
    state.scores[turnKey] += 10;
  }
  q.userAnswer = opt;
  q.wasCorrect = isCorrect;
  q.turnKey = turnKey;

  var buttons = document.querySelectorAll("#choices .choice");
  buttons.forEach(function(b){
    b.disabled = true;
    var label = b.querySelector("span:last-child").textContent;
    if(label === q.correct){
      b.classList.add("correct");
    } else if(b === btn){
      b.classList.add("wrong");
    } else {
      b.classList.add("dim");
    }
  });

  var fb = document.getElementById("feedback");
  var turnPlayerName = playerByKey(turnKey).name;
  var needsCountryName = q.type === "capital" || q.type === "continent";
  var answerText = needsCountryName ? q.correct + " (" + q.country.name + ")" : q.correct;
  fb.textContent = isCorrect
    ? turnPlayerName + " 정답입니다! " + (needsCountryName ? "(" + q.country.name + ") " : "") + "(+10pt)"
    : "아쉬워요. 정답은 " + answerText + "예요.";
  fb.className = "feedback " + (isCorrect ? "correct" : "wrong");

  document.getElementById("scoreBox").textContent = state.score + " pt";
  renderScoreBoard();

  appendNextButton();
}

function rankFor(score, totalQ){
  var pct = score / (totalQ*10);
  if(pct === 1) return "만점! 세계지도가 머릿속에 있네요 🗺️";
  if(pct >= 0.8) return "베테랑 여행가";
  if(pct >= 0.6) return "성실한 지리 탐험가";
  if(pct >= 0.4) return "초보 항해사";
  return "다시 도전해볼까요?";
}

function renderResults(){
  state.screen = "results";
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("qCount").textContent = "완료 · " + state.totalQ + "문항";

  var missed = state.quiz.filter(function(q){ return !q.wasCorrect; });
  var ranking = state.turnOrder.slice().sort(function(a,b){ return state.scores[b]-state.scores[a]; });
  var medals = ["🥇","🥈","🥉","🎖️"];

  var card = document.getElementById("card");
  var html =
    '<div class="results">' +
    '<div class="mode-tag">최종 결과 · ' + continentLabel(state.selectedContinents) + '</div>' +
    '<div class="tally">' + state.score + ' / ' + (state.totalQ*10) + '</div>' +
    '<div class="rank">' + rankFor(state.score, state.totalQ) + '</div>';

  if(ranking.length > 1){
    html += '<div class="score-board" style="margin-bottom:6px;">' + ranking.map(function(k, i){
      var p = playerByKey(k);
      return '<span class="score-chip' + (i===0?" leader":"") + '">' + (medals[i]||"🏅") + ' ' + p.icon + ' ' + p.name +
        ' <span class="pts">' + state.scores[k] + '</span></span>';
    }).join("") + '</div>';
  }

  if(missed.length){
    html += '<div class="miss-list">';
    missed.forEach(function(q){
      html += '<div class="miss-row"><img class="f" src="' + flagSrc(q.country.flag) + '" alt="국기">' +
        '<span class="name">' + q.country.name + '</span>' +
        '<span class="ans">내 답: ' + q.userAnswer + ' → </span>' +
        '<span class="correct-ans">' + q.correct + '</span></div>';
    });
    html += '</div>';
  }

  html += '<div class="results-actions">' +
    '<button class="next-btn" id="retryBtn">같은 대륙 다시</button>' +
    '<button class="ghost-btn" id="menuBtn">대륙 다시 고르기</button>' +
    (state.mode === "map" ? state.turnOrder.map(function(k){
      var p = playerByKey(k);
      return '<button class="ghost-btn mq-atlas-btn" data-atlas="' + k + '">' + p.icon + ' ' + p.name + ' 지도</button>';
    }).join("") : '') +
    '</div></div>';
  card.innerHTML = html;

  document.getElementById("retryBtn").addEventListener("click", function(){
    beginGame();
  });
  document.getElementById("menuBtn").addEventListener("click", goToStart);
  card.querySelectorAll(".mq-atlas-btn").forEach(function(b){
    b.addEventListener("click", function(){
      mapReq++; // 다시하기 기록 읽는 중이면 취소
      MQMapQuiz.renderAtlas(card, playerByKey(b.getAttribute("data-atlas")), renderResults);
    });
  });
}

function goToStart(){
  mapReq++; // 불러오는 중인 지도 요청 취소
  state.screen = "start";
  renderStart();
}

document.getElementById("backBtn").addEventListener("click", goToStart);

renderStart();
// 지도·기록 미리 불러오기 (실패는 무시: 시작 버튼을 누르면 다시 시도)
MQMapQuiz.ready(PLAYERS.map(function(p){ return p.key; })).catch(function(){});
})();
</script>

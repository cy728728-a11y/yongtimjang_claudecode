<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>촬영 화면</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#121417;--card:#1d2026;--line:#2c313a;--ink:#f3f1ec;--mute:#9aa1ad;--acc:#ff8a3d;--ok:#4cc38a;--bad:#ff5d5d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 6vw}
.s{width:100%;max-width:1500px;text-align:center}
.tag{display:inline-block;font-weight:700;color:var(--acc);letter-spacing:.2em;font-size:2.2vw;margin-bottom:2vh}
h1{font-weight:900;font-size:6vw;line-height:1.2}
h2{font-weight:900;font-size:4vw;line-height:1.3;margin-bottom:5vh}
.sub{color:var(--mute);font-size:2vw;margin-top:3vh}
.row{display:flex;gap:2.5vw;justify-content:center;align-items:stretch}
.box{flex:1;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:4vh 2vw}
.box .ic{font-size:8vw;line-height:1.1}
.box .k{font-weight:900;font-size:3.2vw;margin-top:2vh}
.box .v{color:var(--mute);font-size:1.7vw;margin-top:1vh}
.box .eq{color:var(--acc);font-weight:900;font-size:2.4vw;margin-top:1.5vh}
.box.off{opacity:.35;filter:grayscale(1)}
.x{color:var(--bad);font-weight:900;font-size:2vw;margin-top:1vh}
.list{text-align:left;display:grid;gap:2vh;font-size:2.6vw;font-weight:700;max-width:1100px;margin:0 auto}
.list.two{grid-template-columns:1fr 1fr;font-size:2.2vw;max-width:1400px}
.list div{background:var(--card);border-left:8px solid var(--acc);border-radius:14px;padding:1.6vh 1.6vw}
.list b{color:var(--acc);margin-right:1vw}
.prompt{text-align:left;background:#0b0d10;border:2px solid var(--line);border-radius:20px;padding:4vh 3vw;font-size:2.4vw;line-height:1.7;max-width:1300px;margin:0 auto}
.prompt::before{content:"> ";color:var(--acc);font-weight:900}
.term{text-align:left;background:#0b0d10;border-radius:16px;padding:3vh 2.5vw;font-family:Consolas,monospace;font-size:1.9vw;line-height:1.7;border:2px solid var(--line)}
.term .e{color:var(--bad)}
.ph{border:3px dashed var(--acc);border-radius:20px;padding:4vh 3vw;font-size:2.2vw;color:var(--acc)}
.key{display:inline-block;background:var(--ink);color:var(--bg);font-weight:900;border-radius:14px;padding:1.5vh 2vw;font-size:4vw;box-shadow:0 8px 0 #888}
#bar{position:fixed;left:0;right:0;bottom:0;height:6px;background:var(--line)}#bar i{display:block;height:100%;background:var(--acc)}
#menu{position:fixed;inset:0;background:rgba(10,11,13,.96);display:none;overflow:auto;padding:4vh 4vw;columns:3;font-size:15px}
#menu a{display:block;color:var(--ink);text-decoration:none;padding:4px 0}#menu a:hover{color:var(--acc)}
</style></head><body>
<div id="stage"></div><div id="bar"><i></i></div><div id="menu"></div>
<script>

];
const st=document.getElementById('stage'),bar=document.querySelector('#bar i'),menu=document.getElementById('menu');
menu.innerHTML=S.map((s,i)=>`<a href="#${s[0]}">${i+1}. ${s[1]}</a>`).join('');
function show(){let id=location.hash.slice(1),i=Math.max(0,S.findIndex(s=>s[0]===id));st.innerHTML=`<div class="s">${S[i][2]}</div>`;bar.style.width=((i+1)/S.length*100)+'%';document.title=S[i][1];menu.style.display='none';cur=i}
let cur=0;addEventListener('hashchange',show);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')location.hash=S[Math.min(cur+1,S.length-1)][0];if(e.key==='ArrowLeft')location.hash=S[Math.max(cur-1,0)][0];if(e.key==='m')menu.style.display=menu.style.display==='block'?'none':'block'});
show();
</script></body></html>
